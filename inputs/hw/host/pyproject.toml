[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wrist-imu"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pyserial==3.5",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
wrist-imu = "wrist_imu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
